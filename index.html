<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificación General - IX Carrera de Ciclismo Alirio Carreño Rueda</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <img class="logo-tct" src="Logo TCT.png" alt="Logo TCT">
            <h1>IX Carrera de Ciclismo "Alirio Carreño Rueda"</h1>
            <h2>Etapa 2 - Clasificación General</h2>
            <p class="header-info">Betulia - Santander, 10.10.2026</p>
        </div>
    </header>

    <main class="main-container">
        <section class="filters-section">
            <h3>Filtros de Búsqueda</h3>
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="filterNombre">Nombre</label>
                    <input type="text" id="filterNombre" placeholder="Buscar por nombre...">
                </div>
                <div class="filter-group">
                    <label for="filterCategoria">Categoría</label>
                    <select id="filterCategoria">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterEquipo">Equipo</label>
                    <select id="filterEquipo">
                        <option value="">Todos los equipos</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterDorsal">Dorsal</label>
                    <input type="number" id="filterDorsal" placeholder="Buscar dorsal...">
                </div>
            </div>
            <button class="btn-clear" onclick="clearFilters()">Limpiar Filtros</button>
        </section>

        <section class="results-section">
            <div class="results-header">
                <h3>Resultados</h3>
                <span id="resultsCount" class="results-count"></span>
            </div>
            <div id="resultsGrid" class="results-grid"></div>
        </section>
    </main>

    <div id="diplomaModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Diploma</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <canvas id="diplomaCanvas"></canvas>
            </div>
            <div class="modal-footer">
                <button class="btn btn-download" onclick="downloadDiploma()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Descargar
                </button>
                <button class="btn btn-print" onclick="printDiploma()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    Imprimir
                </button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>Secretaría de Desarrollo - Betulia, Santander</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="pdf_data.js"></script>
    <script src="datos.js"></script>
    <script src="app.js"></script>
</body>
</html>
